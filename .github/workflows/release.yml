name: release
# Spec S9.6: a release is made by pushing a tag vX.Y.Z (git tag v1.0.0 && git push origin v1.0.0).
# The tag must match project(VERSION) in CMakeLists.txt. The full build of build.yml (all four platforms,
# tests, validators, the Windows installer and its test) runs first; only when everything passes is the
# GitHub Release published, with the downloads renamed to carry the version, SHA-256 checksums and the
# notes from the version's section in architecture/Changes.md.
on:
  push:
    tags: ['v*']
permissions:
  contents: write          # create the release
jobs:
  check:
    name: tag matches the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Compare the tag with CMakeLists.txt
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(LMWSynth VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          tag="${GITHUB_REF_NAME}"
          echo "tag $tag, CMakeLists.txt version $version"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match the version in CMakeLists.txt ($version); raise the version first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Release files
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.check.outputs.version }}"
          mkdir release
          for p in ubuntu-24.04 fedora-45 macos; do
            cp "artifacts/LMW-Synth-$p/LMW-Synth-$p.tar.gz" "release/LMW-Synth-$v-$p.tar.gz"
          done
          (cd artifacts/LMW-Synth-windows && zip -qr "../../release/LMW-Synth-$v-windows.zip" LMW-Synth-windows)
          cp "artifacts/LMW-Synth-windows/LMW-Synth-$v-setup.exe" release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -l release
          cat release/SHA256SUMS.txt
      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.check.outputs.version }}"
          {
            echo "LMW-Synth $v — semi-modular software synthesizer, standalone and VST3 (GNU AGPL-3.0-or-later)."
            echo
            echo "**Windows:** LMW-Synth-$v-setup.exe installs or updates the app and the VST3 plugin (just for you, or for all users). Not signed: SmartScreen asks first (More info → Run anyway)."
            echo "**macOS, Linux:** unpack the .tar.gz; copy LMW-Synth.vst3 to ~/Library/Audio/Plug-Ins/VST3 (macOS) or ~/.vst3 (Linux). Not signed: macOS asks first (right-click → Open)."
            echo "Checksums: SHA256SUMS.txt. Source: ${{ github.server_url }}/${{ github.repository }}/tree/v$v"
            echo
            # The version's section of Changes.md ("## 1.0.0 ..." up to the next "## ").
            awk -v v="$v" '$0 ~ "^## " v "( |$)" {on=1; next} on && /^## / {exit} on {print}' architecture/Changes.md
          } > notes.md
          cat notes.md
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ needs.check.outputs.version }}"
          gh release create "v$v" release/* --title "LMW-Synth $v" --notes-file notes.md --verify-tag
