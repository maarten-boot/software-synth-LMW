name: build
on: [push, pull_request]
jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu pinned to 24.04 (not -latest): binaries built here also run on 24.04 and newer (Spec S2.1).
          - name: ubuntu-24.04
            os: ubuntu-24.04
          - name: fedora-45
            os: ubuntu-24.04
            container: registry.fedoraproject.org/fedora:45@sha256:5db9683660938d440b057d412247ee245172b9724f42428ae95ae01253bae699
          # Fixed image labels instead of -latest (Spec S2.3: runner images cannot be pinned by hash,
          # so a version label keeps a GitHub image update from changing the build unannounced).
          - name: macos
            os: macos-26
          - name: windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Fedora deps
        if: startsWith(matrix.name, 'fedora')
        run: |
          dnf install -y git tar gzip cmake ninja-build gcc-c++ pkgconf-pkg-config alsa-lib-devel freetype-devel \
            fontconfig-devel libX11-devel libXrandr-devel libXinerama-devel libXcursor-devel libXext-devel \
            mesa-libGL-devel libXi-devel mesa-libEGL-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ubuntu deps
        if: startsWith(matrix.name, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev \
            libxi-dev libegl-dev
      # JUCE archive cached between runs (key = pinned version file), so a GitHub download hiccup
      # cannot fail the build; the archive's SHA-256 is verified on every use (Spec S2.3).
      - name: JUCE archive cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .juce-cache
          key: juce-${{ hashFiles('cmake/JuceVersion.cmake') }}
      - name: Fetch JUCE archive (cache miss only; retries)
        shell: bash
        run: cmake -DDEST="$GITHUB_WORKSPACE/.juce-cache/juce.tar.gz" -P cmake/FetchJuceArchive.cmake
      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DLMW_JUCE_ARCHIVE="$GITHUB_WORKSPACE/.juce-cache/juce.tar.gz"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      # Downloadable build per platform (Spec S9.3): standalone app, VST3 bundle and the lmw9p client.
      # Unix: packed as .tar.gz first, because an artifact zip loses the executable bit.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          a=build/LMWSynth_artefacts/Release
          d="LMW-Synth-${{ matrix.name }}"
          mkdir -p "dist/$d"
          cp -R "$a/VST3/LMW-Synth.vst3" "dist/$d/"
          cp -R "$a"/Standalone/LMW-Synth* "dist/$d/"
          if [ -f build/Release/lmw9p.exe ]; then cp build/Release/lmw9p.exe "dist/$d/"; else cp build/lmw9p "dist/$d/"; fi
          cp LICENSE "dist/$d/"
          echo "LMW-Synth ${{ github.sha }} built on ${{ matrix.name }}; source: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}" > "dist/$d/BUILD.txt"
          if [ "${{ runner.os }}" != "Windows" ]; then (cd dist && tar czf "$d.tar.gz" "$d" && rm -rf "$d"); fi
          ls -R dist | head -40
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LMW-Synth-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
